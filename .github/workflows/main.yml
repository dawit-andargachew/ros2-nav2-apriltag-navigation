name: Colcon Build (ROS 2 Jazzy)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install ROS 2 Jazzy (base)
      - name: Install ROS 2 Jazzy
        run: |
          sudo apt-get update && sudo apt-get install -y locales
          sudo locale-gen en_US en_US.UTF-8
          sudo update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
          export LANG=en_US.UTF-8
          
          sudo apt-get install -y curl gnupg2 lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          
          echo "deb [signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null

          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base python3-rosdep

          sudo rosdep init || true
          rosdep update

      # Install ONLY what your package needs (automatically via rosdep)
      - name: Install package dependencies
        run: |
          rosdep install --from-paths . --ignore-src -r -y

      # Build your single ROS 2 package
      - name: Build package
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+
